<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imixs-Diagram – Prototype</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../src/imixs-diagram.css">
    <style>
        body { font-family: system-ui, sans-serif; margin: 24px; color: #1a202c; }
        #diagram { height: 640px; }
        .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
        .toolbar button, .toolbar label { font: inherit; padding: 4px 12px; cursor: pointer;
            border: 1px solid #cbd5e0; border-radius: 5px; background: #fff; }
        .toolbar input[type=file] { display: none; }
        #message { color: #c53030; }
        pre { background: #f4f4f5; padding: 12px; font-size: 12px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Imixs-Diagram – Prototype</h1>
    <p>
        Click an element or an edge to see its actions and properties. Double click jumps to the name field,
        <kbd>Del</kbd> deletes the selection. The layout is computed automatically.<br>
        Drag on empty space to move the diagram, the mouse wheel zooms.
        <a href="orgchart.html">Org chart demo</a> · <a href="skillmap.html">Skill map demo</a>
    </p>

    <div class="toolbar">
        <button type="button" id="new">New</button>
        <label>Open .bpmn…<input type="file" id="open" accept=".bpmn,.xml"></label>
        <button type="button" id="download">Download .bpmn</button>
        <span id="message"></span>
    </div>

    <div id="diagram"></div>

    <h2>BPMN 2.0</h2>
    <pre id="model"></pre>

    <script type="module">
        import { createDiagram } from '../src/index.js';

        const output = document.getElementById('model');
        const message = document.getElementById('message');
        let diagram = null;

        // Core workflows and their messages (start messages, published messages and
        // end task names), as the host application would provide them
        const workflows = {
            Inquiry: ['create', 'Completed'],
            Offer: ['create', 'Initial sampling requested', 'Accepted', 'Rejected'],
            Order: ['create', 'Completed'],
            Invoice: ['create', 'Paid', 'Cancelled']
        };

        /**
         * Replaces the diagram with a new editor for the given source (BPMN XML or nothing).
         * If the source is rejected, the current diagram stays.
         */
        function load(source) {
            const current = document.getElementById('diagram');
            const host = document.createElement('div');
            host.id = 'diagram';
            current.replaceWith(host);
            try {
                diagram = createDiagram(host, source, { workflows });
            } catch (error) {
                host.replaceWith(current);
                throw error;
            }
            const show = () => output.textContent = diagram.getBPMN();
            show();
            diagram.onChange(show);
        }

        document.getElementById('new').addEventListener('click', () => {
            message.textContent = '';
            load();
        });

        document.getElementById('open').addEventListener('change', async event => {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) {
                return;
            }
            try {
                const text = await file.text();
                load(text);
                message.textContent = '';
            } catch (error) {
                message.textContent = error.message;
            }
        });

        document.getElementById('download').addEventListener('click', () => {
            const problems = diagram.validate();
            message.textContent = problems.length > 0
                ? `Saved with ${problems.length} open point(s): ${problems.map(p => p.message).join('; ')}`
                : '';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([diagram.getBPMN()], { type: 'application/xml' }));
            link.download = (diagram.getModel().properties.name || 'model') + '.bpmn';
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        });

        load();
    </script>
</body>
</html>
